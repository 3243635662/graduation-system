packages:
  - frontend
  - backend
  - packages/*

catalog:
  nano-staged: ^1.0.2
  oxfmt: ^0.75.0
  oxlint: ^1.90.0
  oxlint-tsgolint: ^7.0.2001
  simple-git-hooks: ^2.14.0

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici@6.20.1
autoInstallPeers: false
shellEmulator: true

allowBuilds:
  maplibre-gl: true
  simple-git-hooks: true
  vue-demi: true
